
[build-system]
requires = ["uv_build>=0.8.20,<0.9.0"]
build-backend = "uv_build"

[project]
name = "alpasim_driver"
version = "0.91.0"
description = "Adapters for open-source drivers in Alpasim"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vam",
  "alpamayo_r1",
  "alpamayo1_5",
  "einops",
  "numpy",
  "opencv-python-headless",
  "torch",
  "pillow",
  "rich",
  "click",
  "grpcio",
  "hydra-core",
  "omegaconf",
  "alpasim-grpc",
  "alpasim_plugins",
  "pygame>=2.5.0", # manual driving
  "alpasim_utils[geometry]",
  "alpamayo2_super",
]

[project.optional-dependencies]
recipes = [
  "alpamayo-recipes @ git+https://github.com/NVlabs/alpamayo-recipes.git@bfebb8451366b166611f4a84920bff1857d69d46#subdirectory=src",
  "alpamayo1-5-sft @ git+https://github.com/NVlabs/alpamayo-recipes.git@bfebb8451366b166611f4a84920bff1857d69d46#subdirectory=recipes/alpamayo1_5_sft",
]

[project.scripts]
alpasim_driver_main = "alpasim_driver.main:main"

[project.entry-points."alpasim.models"]
alpamayo1 = "alpasim_driver.models.alpamayo1_model:Alpamayo1Model"
alpamayo1_5 = "alpasim_driver.models.alpamayo1_5_model:Alpamayo15Model"
alpamayo1_5_recipes_sft = "alpasim_driver.models.alpamayo1_5_recipes_sft_model:Alpamayo15RecipesSFTModel"
alpamayo2 = "alpasim_driver.models.alpamayo2_model:Alpamayo2Model"
vam = "alpasim_driver.models.vam_model:VAMModel"
manual = "alpasim_driver.models.manual_model:ManualModel"

[tool.uv.sources]
vam = { git = "https://github.com/valeoai/VideoActionModel.git" }
alpamayo_r1 = { git = "https://github.com/NVlabs/alpamayo.git" }
alpamayo1_5 = { git = "https://github.com/NVlabs/alpamayo1.5.git" }
alpamayo2_super = { git = "https://github.com/NVlabs/alpamayo2.git" }
alpasim-grpc = { workspace = true }
alpasim_utils = { workspace = true }
alpasim_plugins = { workspace = true }
