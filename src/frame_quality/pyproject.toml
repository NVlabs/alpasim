[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpasim-frame-quality"
version = "0.42.0"
description = "Frame-quality scoring microservice"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alpasim_grpc",
  "grpcio",
  "numpy",
  "opencv-python-headless",
  "torch",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.uv.sources]
alpasim_grpc = {workspace = true}

[tool.setuptools]
packages = ["frame_quality"]
