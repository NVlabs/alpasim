syntax = "proto3";

import "alpasim_grpc/v0/common.proto";

service RuntimeService {
    rpc simulate (SimulationRequest) returns (SimulationReturn);
    rpc prefetch_clip (ClipPrefetchRequest) returns (common.Empty);
    rpc get_runtime_info (common.Empty) returns (RuntimeInfo);
    rpc shut_down (common.Empty) returns (common.Empty);
}

message ClipPrefetchRequest {
    // Prefetch operates on data shared by every scene for a clip.
    string clip_id = 1;
}

message RolloutSpec {
    reserved 1, 4;
    reserved "scenario_id", "start_time_offset_us";
    uint32 nr_rollouts = 2;
    // Optional client-supplied session UUIDs, one per rollout. If set,
    // length must equal nr_rollouts. Empty (default) ⇒ runtime generates.
    repeated string session_uuids = 3;
    // Base random seed for this spec's rollouts: rollout k uses random_seed + k as
    // its session seed, so a specific rollout can be reproduced on its own.
    // 0 (default) keeps today's behaviour: the runtime picks a random seed per session.
    fixed64 random_seed = 5;
    SceneInfo scene = 6;
    // Optional timestamped ego-rig poses executed by a parent rollout. When
    // present, scene.policy_start_us must select the fork handoff and the
    // history must end at the corresponding absolute source timestamp.
    common.Trajectory ego_history = 7;
}

message SimulationRequest {
    message DriverAddress {
        string ip = 1;
        uint32 port = 2;
    }

    repeated DriverAddress available_drivers = 1;
    repeated RolloutSpec rollout_specs = 2; // a scene may be repeated across specs
    uint32 n_concurrent_per_driver = 3;
}

message SceneMetadata {
    reserved 4;
    reserved "uuid";
    string version_string = 1;
    string training_date = 2;
    string dataset_hash = 3;

    repeated string camera_ids = 5;
    repeated string lidar_ids = 6;

    fixed64 start_time_us = 7;
    fixed64 end_time_us = 8;
}

message ClipDataSource {
    string clip_id = 1;
    string usdz_uuid = 2;
}

message DataSource {
    oneof kind {
        ClipDataSource clip = 1;
    }
}

message SceneInfo {
    reserved 1, 2;
    reserved "scene_id", "provider_kind";
    SceneMetadata metadata = 3;
    DataSource source = 4;
    // Recording-relative policy handoff. Absent represents AUTO.
    optional fixed64 policy_start_us = 5;
}

message ServiceCapacity {
    string service_name = 1;
    uint32 total_capacity = 2;
    bool skipped = 3;
}

message RuntimeInfo {
    uint32 max_supported_concurrent_rollouts = 1;
    uint32 nr_workers = 2;
    string renderer_type = 3;

    repeated SceneInfo scenes = 4;
    repeated ServiceCapacity service_capacities = 5;

    common.VersionId runtime_version = 6;
    common.VersionId nre_version = 7;
    common.VersionId physics_version = 8;
    common.VersionId driver_version = 9;
    common.VersionId traffic_version = 10;
    common.VersionId video_model_version = 11;
}

// How per-timestep metric values should be reduced to a single scalar.
enum TimeAggregation {
    TIME_AGGREGATION_UNSPECIFIED = 0;
    TIME_AGGREGATION_MEAN = 1;
    TIME_AGGREGATION_MEDIAN = 2;
    TIME_AGGREGATION_MAX = 3;
    TIME_AGGREGATION_MIN = 4;
    TIME_AGGREGATION_LAST = 5;
    TIME_AGGREGATION_P90 = 6;
}

enum RolloutErrorCode {
    ROLLOUT_ERROR_CODE_NONE = 0;
    ROLLOUT_ERROR_CODE_UNSPECIFIED = 1;
    ROLLOUT_ERROR_CODE_INVALID_SCENE = 2;
}

message SimulationReturn {
    // A single named metric sampled at each simulation timestep.
    message TimestepMetric {
        string name = 1;
        repeated fixed64 timestamps_us = 2;
        repeated double values = 3;
        repeated bool valid = 4;
        TimeAggregation time_aggregation = 5;
    }

    message RolloutReturn {
        RolloutSpec rollout_spec = 1;
        bool success = 2;
        string rollout_uuid = 3;
        string error = 4;
        repeated TimestepMetric timestep_metrics = 5;
        map<string, double> aggregated_metrics = 6;
        RolloutErrorCode error_code = 7;
    }

    common.VersionId runtime_version = 1;
    common.VersionId nre_version = 2;
    common.VersionId physics_version = 3;
    common.VersionId driver_version = 4;
    common.VersionId traffic_version = 5;

    repeated RolloutReturn rollout_returns = 6;
    common.VersionId video_model_version = 7;
}
