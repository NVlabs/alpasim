# @package _global_

runtime:
  simulation_config:
      cameras:
      -
        # NRE preserves the source camera aspect ratio, so 1900 is only the
        # requested width. The decoded width can vary by scene.
        height: 1080
        width: 1900  # Request width; decoded width can differ.
        logical_id: camera_front_wide_120fov

        # If you change this see note in base_config.yaml about `driver.inference.Cframes_subsample`
        frame_interval_us: 100_000
        shutter_duration_us: 30_000
      -
        height: 1080
        width: 1900  # Request width; decoded width can differ.
        logical_id: camera_front_tele_30fov

        # If you change this see note in base_config.yaml about `driver.inference.Cframes_subsample`
        frame_interval_us: 100_000
        shutter_duration_us: 30_000
