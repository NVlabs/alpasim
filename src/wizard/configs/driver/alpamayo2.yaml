# Should be used in defaults list, e.g.
# - /driver: alpamayo2
# Type validation happens at driver runtime via OmegaConf.structured merge

defaults:
  - alpamayo_configs    # Camera and simulation configs for 4-cam 10Hz
  - _self_              # YAML values override schema defaults

# Alpamayo 2 Super Driver Configuration for Alpasim

# Logging level (uses wizard's global setting)
log_level: ${wizard.log_level}

# Model configuration
model:
  model_type: alpamayo2  # Entry-point name in alpasim.models registry
  # HuggingFace model ID (requires cached download or hf authentication in the driver container)
  checkpoint_path: "nvidia/Alpamayo2-Super"
  # # Alternative local path to a release-native checkpoint directory
  # # (config.json + tokenizer/processor files + *.safetensors shards)
  # checkpoint_path: "/mnt/drivers/alpamayo2/Alpamayo-2-Super-32B"
  device: "cuda"
  force_determinism: false
  image_decode_device: cuda
  num_trajectory_samples: 1
  trajectory_candidate_microbatch_size: null
  trajectory_selection:
    strategy: ALWAYS_FIRST  # [ALWAYS_FIRST, CLOSEST_3D, CLOSEST_LATERAL]
    max_num_distance_points: 64
    skip_first_n_distance_points: 0

# Server configuration
host: "0.0.0.0"
port: ???

# Inference configuration
inference:
  use_cameras:
     - camera_cross_left_120fov
     - camera_front_wide_120fov
     - camera_cross_right_120fov
     - camera_front_tele_30fov
  max_batch_size: 1  # 32B model, start with batch size 1
  subsample_factor: 1
  context_length: 4  # 4 temporal frames per camera

# Route configuration — A2 uses language-based navigation, not waypoint commands
route:
  use_waypoint_commands: false

# Output configuration
output_dir: "/mnt/output/driver"

# Trajectory optimization (disabled by default for A2)
trajectory_optimizer:
  enabled: false

plot_debug_images: false
