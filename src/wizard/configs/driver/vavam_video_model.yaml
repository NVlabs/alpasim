# @package _global_
# VaVAM preset for video-model rendering.
#
# The video model returns frames using the recorded USDZ f-theta camera. Keep
# that calibration for video-model conditioning, then rectify the returned
# image in the driver to the pinhole view expected by VaVAM.

defaults:
  - vavam@driver
  - _self_

driver:
  rectification:
    camera_front_wide_120fov:
      focal_length: [1545.0, 1545.0]
      principal_point: [960.0, 560.0]
      resolution_hw: [1080, 1920]
      radial: [-0.356123, 0.172545, -0.05231, 0.0, 0.0, 0.0]
      tangential: [-0.00213, 0.000464]
      thin_prism: [0.0, 0.0, 0.0, 0.0]
      max_overscan_scale: 2.0
      safety_margin_px: 10

runtime:
  # Video-model conditioning and seed frames must retain recorded calibration.
  extra_cameras: []
