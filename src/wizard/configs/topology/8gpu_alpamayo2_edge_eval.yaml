# @package _global_
# Eight-GPU (80 GB H100) Alpamayo 2 Edge evaluation topology. Each Edge driver
# serves one request at a time and uses ~10 GB, so five drivers share each of
# GPUs 0-5. Three renderers share each of GPUs 6 and 7 with one physics instance
# each. Measured on an H100 cluster: 30 drivers gave ~25% more drive calls per
# second than 18; more drivers per GPU near the memory limit for little gain.

defines:
  nre_cache_size: 6  # renderer.n_concurrent_rollouts + 1
  physics_cache_size: 16
  # Edge preprocesses images on the CPU. Unbounded thread pools in 30 drivers
  # oversubscribe the 192-core node, so each driver gets 5 threads.
  driver_cpu_threads: "5"

services:
  renderer:
    # NRE does not support replicas; repeat a GPU to share it.
    replicas_per_container: 1
    gpus: [6, 6, 6, 7, 7, 7]

  driver:
    replicas_per_container: 5
    gpus: [0, 1, 2, 3, 4, 5]

  physics:
    replicas_per_container: 1
    gpus: [6, 7]

  controller:
    replicas_per_container: 30
    gpus: null

runtime:
  nr_workers: 6
  endpoints:
    # Total capacity per service = nr_gpus x replicas_per_container x n_concurrent_rollouts
    # REND: 6 x 1  x 5  = 30
    # DRIV: 6 x 5  x 1  = 30
    # PHYS: 2 x 1  x 15 = 30
    # CONT: 1 (CPU) x 30 x 1 = 30
    renderer:
      n_concurrent_rollouts: 5
    driver:
      n_concurrent_rollouts: 1
    physics:
      n_concurrent_rollouts: 15
      skip: false
    controller:
      n_concurrent_rollouts: 1
