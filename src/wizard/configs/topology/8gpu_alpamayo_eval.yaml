# @package _global_
# Comparable 8-GPU evaluation topology for Alpamayo 1, 1.5, and 2. Each model
# gets one driver process on each of GPUs 0-6; renderer and physics share GPU 7.

defines:
  nre_cache_size: 20
  physics_cache_size: 16

services:
  renderer:
    replicas_per_container: 1
    gpus: [7]

  driver:
    replicas_per_container: 1
    gpus: [0, 1, 2, 3, 4, 5, 6]

  physics:
    replicas_per_container: 1
    gpus: [7]

  controller:
    replicas_per_container: 7
    gpus: null

runtime:
  nr_workers: 2
  endpoints:
    # Each service has capacity 7, matching the seven driver GPUs.
    renderer:
      n_concurrent_rollouts: 7
    driver:
      n_concurrent_rollouts: 1
    physics:
      n_concurrent_rollouts: 7
      skip: false
    controller:
      n_concurrent_rollouts: 1
